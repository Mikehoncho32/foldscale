name: Foldscale

options:
  bundleIdPrefix: io.github.mikehoncho32
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  FoldscaleCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""

targets:
  FoldscaleApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/FoldscaleApp
    dependencies:
      - package: FoldscaleCore
        product: FoldscaleCore
    settings:
      base:
        PRODUCT_NAME: Foldscale
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikehoncho32.foldscale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Foldscale
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. See LICENSE."
        # Foldscale ships non-sandboxed (handoff §3): a disk analyzer needs real
        # filesystem access, gated by user-granted Full Disk Access (TCC), not
        # an entitlement. Hardened runtime is required for notarization (Milestone 6).
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
