name: Foldscale

options:
  bundleIdPrefix: io.github.mikehoncho32
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  FoldscaleCore:
    path: .
  # Auto-updates (ADR-0005). Pinned exactly: Package.resolved lives inside the gitignored
  # .xcodeproj, so `from:` would drift silently and the signing steps in
  # Scripts/build-dmg.sh track a known framework layout.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""

targets:
  FoldscaleApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/FoldscaleApp
        excludes:
          - Info.plist
    # Sparkle 2 keys (ADR-0005). INFOPLIST_KEY_ can't inject custom keys, so xcodegen
    # writes this small Info.plist and Xcode merges it with the generated one. The
    # boolean/interval Sparkle keys are deliberately absent: Sparkle asks the user for
    # permission on the second launch and uses its 24 h default interval.
    info:
      path: Sources/FoldscaleApp/Info.plist
      properties:
        SUFeedURL: https://foldscale.com/appcast.xml
        SUPublicEDKey: 0u/UzBxsUnYWhF9MZxeE9p7eCPniauSKsPo7ZVBZqvI=
    dependencies:
      - package: FoldscaleCore
        product: FoldscaleCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Foldscale
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikehoncho32.foldscale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Foldscale
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. See LICENSE."
        # Foldscale ships non-sandboxed (handoff §3): a disk analyzer needs real
        # filesystem access, gated by user-granted Full Disk Access (TCC), not
        # an entitlement. Hardened runtime is required for notarization (Milestone 6).
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
