name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the feed (same check as CI) and make sure its newest download is live
        run: |
          sudo apt-get install -y -q libxml2-utils >/dev/null
          Scripts/check-version.sh
          if grep -q '<item>' site/appcast.xml; then
            url=$(xmllint --xpath 'string(//item[1]/enclosure/@url)' site/appcast.xml)
            [ -n "$url" ] || { echo "newest appcast item has no enclosure"; exit 1; }
            for _ in $(seq 1 30); do curl -fsIL -o /dev/null "$url" && exit 0; sleep 20; done
            echo "newest appcast enclosure is not downloadable after 10 minutes: $url"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
