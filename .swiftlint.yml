included:
  - Sources
  - Tests

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
  # We intentionally use the non-failable String(decoding:as:) for filename bytes,
  # which decodes invalid UTF-8 lossily rather than returning nil.
  - optional_data_string_conversion
  # swift-format owns trailing-comma style (it adds them in multi-line literals).
  - trailing_comma

line_length:
  warning: 120
  error: 200

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

type_name:
  min_length: 3

# The struct-of-arrays FileTree and the ScanStore are intentionally cohesive
# single types (ADR-0001); allow them a little more room than the defaults.
file_length:
  warning: 600
  error: 900

type_body_length:
  warning: 350
  error: 500
